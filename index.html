<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개인 QMS</title>
<!-- 설치형 앱(PWA): 웹 주소(https)로 열었을 때 ‘앱으로 설치’ · 오프라인 실행. 파일로 직접 열면 지금처럼 동작 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4f73">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="개인 QMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--sub:#667085;--line:#e3e7ee;--pri:#1f5fbf;--pri2:#e8f0fc;--ok:#1a8f5a;--okb:#e6f5ee;--warn:#b7791f;--warnb:#fdf3e1;--bad:#c0392b;--badb:#fbeaea;--mut:#f0f2f5}
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#14213d;color:#fff}
header h1{font-size:16px;margin:0}
.brandlogo{height:30px;max-width:150px;object-fit:contain;background:#fff;border-radius:5px;padding:3px 6px;display:block}
.print-only{display:none}
.phead{align-items:center;gap:14px;border-bottom:2px solid #14213d;padding-bottom:8px;margin-bottom:14px}
.phead img{max-height:44px;max-width:180px;object-fit:contain}
.phead .t{flex:1}.phead .t b{font-size:17px;display:block}.phead .t span,.phead .d{font-size:11px;color:#555}
.logoprev{display:flex;align-items:center;justify-content:center;width:240px;height:90px;border:1px dashed #b9c6dc;border-radius:8px;background:repeating-conic-gradient(#f0f2f5 0 25%,#fff 0 50%) 0 0/16px 16px}
.logoprev img{max-width:220px;max-height:76px;object-fit:contain}
header .sp{flex:1}
header small{opacity:.75}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
nav button{border:0;background:none;padding:11px 14px;font:inherit;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:bold}
main{padding:16px 18px;max-width:1440px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi .l{color:var(--sub);font-size:12px}.kpi .v{font-size:22px;font-weight:bold;margin-top:4px}.kpi .s{font-size:11px;color:var(--sub);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}
button.b,label.b{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 11px;border-radius:6px;font:inherit;cursor:pointer}
button.b:hover,label.b:hover{background:var(--mut)}
button.p,label.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.p:hover,label.p:hover{background:#174a96}
button.d{color:var(--bad)}
button.s{padding:3px 7px;font-size:12px}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid #cfd5df;border-radius:5px;background:#fff;color:inherit;min-width:0}
textarea{width:100%;min-height:56px;resize:vertical}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f7f8fa;font-weight:bold;color:#3d4659;position:sticky;top:0;white-space:nowrap;font-size:12px;z-index:1}
td.n,th.n{text-align:right;white-space:nowrap}
tr:hover td{background:#fafbfd}
.tw{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:6px}
.bg{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;white-space:nowrap;text-decoration:none}
.bg.ok{background:var(--okb);color:var(--ok)}.bg.warn{background:var(--warnb);color:var(--warn)}.bg.bad{background:var(--badb);color:var(--bad)}.bg.inf{background:var(--pri2);color:var(--pri)}.bg.mut{background:var(--mut);color:var(--sub)}
.muted{color:var(--sub)}
a.lk{color:var(--pri);cursor:pointer;text-decoration:none}a.lk:hover{text-decoration:underline}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:10px;width:min(960px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh h2{font-size:15px;margin:0;flex:1}
.modal .mb{padding:14px 16px}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.fg label.full{grid-column:1/-1}
.fgrp+#bomBox .bomx{margin:-4px 0 10px}.bomx{background:#f5f8fc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:8px}.bomc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.bchip{border:1px solid var(--line);border-radius:12px;padding:2px 8px;background:#fff}.bchip[onclick]{cursor:pointer}.bchip[onclick]:hover{border-color:var(--pri)}.bchip.on{border-color:var(--pri);background:#eef3fc}
.fgrp{border:1px solid var(--line);border-radius:8px;padding:8px 12px 12px;margin-bottom:10px;background:#fff}
.fgrp>.gh{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.fgrp>.gh .muted{font-weight:normal;font-size:11.5px}
.fgrp.fgfound{background:#fbfaf6;border-color:#ece3cf}.fgrp.fgpart{background:#f7f9fd;border-color:#d9e3f3}
.fg.fg4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:820px){.fg.fg4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 같은 줄의 입력칸 높이 맞춤: 라벨이 두 줄로 넘어가도 입력칸은 줄의 아래쪽에 정렬 */
.fg>label:not(.full){justify-content:flex-end}
.fg>label>.lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fg>label>.lt>span{font-size:11px!important}
.fg>label.row{flex-direction:row!important;justify-content:flex-start;align-items:center;align-self:end;margin-top:0!important;min-height:var(--ctl-h,34px)}
.fg>label>span:first-child:not(.row):not(.dl):not(.il){line-height:1.35}
.sec{font-weight:bold;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--line);color:var(--pri);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ct th,.ct td{padding:5px 4px}
.evt td{vertical-align:middle}.evt tfoot td{background:#f7f8fa}
button.evb.on0{background:var(--badb);border-color:#e7a29a;color:var(--bad);font-weight:bold}
button.evb.on05{background:var(--warnb);border-color:#ecc77d;color:var(--warn);font-weight:bold}
button.evb.on1{background:var(--okb);border-color:#8fd0b0;color:var(--ok);font-weight:bold}
.fgl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.fgl textarea{color:var(--ink);line-height:1.6}
/* 진행 기록 */
.logadd{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.lgplan{border:1px solid #f0d49b;background:#fffaf0;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:12.5px}
.lgph{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.lgph .t{position:relative;display:inline-block}.lgph img{width:64px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:zoom-in;display:block}
.lgph .ld{display:inline-flex;width:64px;height:48px;align-items:center;justify-content:center;background:var(--mut);border-radius:4px}
.lgph a{position:absolute;top:-6px;right:-6px;background:#fff;border:1px solid var(--line);border-radius:50%;width:16px;height:16px;font-size:10px;line-height:14px;text-align:center;cursor:pointer;color:var(--bad)}
ul.logs .lr{margin-top:4px;font-size:12.5px;background:#eef6f0;border-radius:4px;padding:3px 7px;display:inline-block}ul.logs .lr b{color:var(--ok);font-size:11.5px}
ul.logs li.vd .lt,ul.logs li.vd .lr{text-decoration:line-through;color:var(--sub)}ul.logs .lv{margin-top:4px;font-size:11.5px;color:var(--bad)}
ul.logs li.ed{background:#f5f9ff;outline:1px solid #cfdcef}
ul.logs .lhist{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;font-size:11.5px;color:var(--sub);display:grid;gap:6px}
.lgreason{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--bad);margin-top:6px}
.lgc{border:1px solid #cfdcef;background:#f5f9ff;border-radius:8px;padding:10px 12px;margin-top:6px}
.lgc .ch{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;color:var(--pri);margin-bottom:8px}
.lgc .cg,ul.logs .cg{display:grid;grid-template-columns:140px 130px 1fr 120px;gap:8px}
.lgc .cg2,ul.logs .cg2{display:grid;grid-template-columns:3fr 2fr;gap:8px;margin-top:8px}
.lgc label,ul.logs li.ed label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--sub)}
.lgc .cf label.b{flex-direction:row;color:inherit;font-size:12px}
.lgc textarea,ul.logs li.ed textarea{min-height:52px}
.lgc .cf,ul.logs .cf{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.lgc .cz-own{margin-top:8px;font-size:12px;background:#fff;border:1px dashed #cfdcef;border-radius:6px;padding:6px 9px;color:var(--sub)}
.lgh{display:flex;align-items:center;gap:8px;margin-top:14px;padding-bottom:4px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600}
.lgh label{font-weight:normal;color:var(--sub);display:flex;gap:4px;align-items:center}
.lgpend{margin-top:8px;font-size:12px;background:var(--warnb);border:1px solid #f0d49b;color:#7a5410;border-radius:6px;padding:6px 10px}
ul.logs li.nw{outline:2px solid #f0d49b;background:#fffbef}
@media(max-width:700px){.lgc .cg,.lgc .cg2,ul.logs .cg,ul.logs .cg2{grid-template-columns:1fr}}
ul.logs{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid #d4dbe6}
ul.logs li{position:relative;margin:0 0 10px;padding:6px 10px;background:#f7f8fa;border-radius:6px}
ul.logs li:before{content:'';position:absolute;left:-21px;top:11px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--pri)}
ul.logs .lh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}ul.logs .lt{margin-top:4px;line-height:1.55;font-size:12.5px}
ul.logs li.au{background:none;padding:2px 10px}ul.logs li.au:before{border-color:#b8c0cc;width:8px;height:8px;left:-20px;top:8px}ul.logs li.au .lt{color:var(--sub);font-size:12px;margin-top:1px}
ul.logs .nx{margin-top:5px;font-size:12px;color:#7a5410;background:#fff7e0;border-radius:4px;padding:3px 7px;display:inline-flex;gap:5px;align-items:center}ul.logs .nx.dn{color:var(--sub);background:var(--mut);text-decoration:line-through}
.route{border:1px solid var(--line);border-radius:8px;margin-top:10px;background:#fff}
.route .rh{font-weight:600;font-size:12.5px;padding:7px 12px;border-bottom:1px solid var(--line);background:#fafbfc;border-radius:8px 8px 0 0}.route .rh .muted{font-weight:normal;margin-left:6px}
.route .ri{display:flex;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid #eef0f3;font-size:12.5px}.route .ri:last-child{border-bottom:0}
.route .ri .tx{flex:1;line-height:1.45}.route .ck{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--mut);color:var(--sub);flex:none}
.route .ri.dn .ck{background:var(--okb);color:var(--ok)}.route .ri.rc .ck{background:var(--pri2);color:var(--pri)}.route .ri.wn .ck{background:var(--warnb);color:var(--warn)}.route .ri.dn b{color:var(--sub);font-weight:normal}
.psum{background:#f7f8fa;border-radius:8px;padding:10px 12px;line-height:1.6;font-size:12.5px}
ul.todo{list-style:none;margin:0;padding:0}ul.todo li{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid #f0f2f5;font-size:13px}
/* 정렬 머리글 */
th.srt{cursor:pointer;user-select:none}th.srt:hover{background:#eceff4}th.srt .ar{margin-left:4px;font-size:10px;color:#a0a8b8}th.srt.on .ar{color:var(--pri)}th.srt.on{color:var(--pri)}
/* 검색형 선택 목록 */
.cbx{position:fixed;z-index:85;background:#fff;border:1px solid #c9d1de;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);display:none;flex-direction:column;overflow:hidden}
.cbx.on{display:flex}
.cbx .cl{overflow-y:auto;max-height:300px;overscroll-behavior:contain}
.cbx .ci{padding:7px 10px;cursor:pointer;border-bottom:1px solid #f0f2f5;line-height:1.35}
.cbx .ci b{font-size:13px}.cbx .ci span{display:block;font-size:11.5px;color:var(--sub)}
.cbx .ci.ac,.cbx .ci:hover{background:var(--pri2)}
.cbx .ci mark{background:#fff3b0;color:inherit;padding:0}
.cbx .cf{padding:5px 10px;font-size:11px;color:var(--sub);background:#f7f8fa;border-top:1px solid var(--line)}
/* 저장 위치 재연결 바 */
.recon{align-items:center;gap:10px;flex-wrap:wrap;background:#fff7e0;border-bottom:1px solid #f0d49b;color:#5c4210;padding:8px 18px;font-size:13px}
/* 설정 화면 */
.set{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start;max-width:1100px;margin:0 auto}
.snav{position:sticky;top:12px;background:#f3f4f7;border:1px solid var(--line);border-radius:12px;padding:6px 8px 10px}
.snav .gh{font-size:12px;color:var(--sub);padding:14px 10px 6px}
.snav button{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.snav button:hover{background:#e8eaef}.snav button.on{background:#e1e5ec;font-weight:bold}
.snav svg{width:19px;height:19px;flex:none;color:#4b5465}
.spane h2{font-size:19px;margin:6px 4px 8px}
.sgh{font-size:15px;font-weight:bold;margin:18px 4px 10px}
.sgrp{background:#f3f4f7;border:1px solid var(--line);border-radius:14px;padding:2px 24px;margin-bottom:22px}
.srow{display:flex;gap:24px;align-items:center;padding:17px 0;border-bottom:1px solid #dfe2e8}
.srow:last-child{border-bottom:0}
.srow .si{flex:1;min-width:0}.srow .st{font-size:14.5px}.srow .sd{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.6}
.srow .sc{flex:none;display:flex;gap:8px;align-items:center}
.srow.blk{display:block}.srow.blk .sc{margin-top:10px;display:block}
.snum{width:96px;text-align:right}.stxt{width:250px}.slist{width:100%;min-height:110px;line-height:1.6}
.sigbox{display:inline-flex;align-items:center;justify-content:center;width:120px;height:40px;border:1px dashed #b9c6dc;border-radius:6px;background:#fff}.sigbox img{max-width:110px;max-height:36px}
@media(max-width:760px){.set{grid-template-columns:1fr}.snav{position:static;display:flex;flex-wrap:wrap;gap:4px}.snav .gh{width:100%;padding:6px 6px 2px}.snav button{width:auto}.srow{flex-direction:column;align-items:flex-start;gap:10px}.stxt{width:100%}}
#photoBox{display:flex;flex-wrap:wrap;gap:10px;padding:4px;border-radius:8px}
#photoBox.drag{outline:2px dashed var(--pri);background:var(--pri2)}
.ph{width:170px;border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;background:#fff}
.ph img{width:100%;height:120px;object-fit:cover;border-radius:4px;cursor:zoom-in;background:var(--mut)}
.ph input{font-size:12px;padding:3px 5px}
.ph.add{align-items:center;justify-content:center;min-height:178px;border:2px dashed #b9c6dc;cursor:pointer;color:var(--pri);text-align:center;font-size:13px;line-height:1.6}
.ph.add:hover{background:var(--pri2)}
.lb{position:fixed;inset:0;background:rgba(10,14,24,.9);display:none;align-items:center;justify-content:center;z-index:70}
.lb.on{display:flex}
.lb figure{margin:0;text-align:center}
.lb img{max-width:86vw;max-height:80vh;display:block;margin:0 auto;background:#fff}
.lb figcaption{color:#fff;margin-top:10px;font-size:13px}
.lbn{font-size:44px;background:none;border:0;color:#fff;cursor:pointer;padding:20px;opacity:.8}.lbn:hover{opacity:1}
.lbt{position:absolute;top:12px;right:12px;display:flex;gap:8px}
#cfm{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
#cfm.on{display:flex}
.cbox{background:#fff;border-radius:12px;width:min(460px,100%);box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;animation:pop .12s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.cbox .ch{padding:16px 18px 6px;font-size:16px;font-weight:bold;display:flex;gap:10px;align-items:center}
.cbox .ch .ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.cbox .ch .ic.dz{background:var(--badb);color:var(--bad)}.cbox .ch .ic.nt{background:var(--pri2);color:var(--pri)}
.cbox .cb{padding:4px 18px 14px 60px;line-height:1.6;color:#3d4659}
.cbox .cb ul{margin:8px 0 0;padding:8px 10px 8px 26px;background:#f7f8fa;border-radius:6px;max-height:200px;overflow:auto}
.cbox .cb .note{margin-top:8px;font-size:12px;color:var(--sub)}
.cbox .cf{padding:12px 18px;background:#f7f8fa;display:flex;gap:8px;justify-content:flex-end}
.cbox.wide{width:min(600px,100%)}.cbox.wide .cb{padding-left:18px;max-height:70vh;overflow:auto}
.cbox .dl-s{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.cbox .dl-o{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.cbox .dl-o label{display:flex;gap:6px;align-items:baseline;cursor:pointer}.cbox .dl-o label.off{opacity:.45;cursor:not-allowed}
.cbox .dl-h{font-weight:600;margin-bottom:2px}.cbox .dl-why{font-size:12px;color:var(--warn)}
.cbox .dl-ck{display:flex;gap:6px;align-items:center;margin-top:14px;padding:8px 10px;background:var(--badb);border-radius:6px;font-weight:600;cursor:pointer}
button.dz:disabled{opacity:.45;cursor:not-allowed}
button.dz{background:var(--bad);color:#fff;border-color:var(--bad)}button.dz:hover{background:#a2301f}
#undo{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 10px 9px 16px;border-radius:8px;display:none;align-items:center;gap:12px;z-index:65;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#undo.on{display:flex}
#undo button{background:#fff;color:#1d2433;border:0;border-radius:5px;padding:5px 12px;font:inherit;font-weight:bold;cursor:pointer}

/* ================= RCA · 사내 8D (PHA QMS 통합) ================= */
.cz{--line2:#eef0f3;--ink2:#56606a;--ink3:#8b949d;--acc:#1f5fbf;--acc-bg:#e9f0fb;--red:#c0392b;--red-bg:#fdeceb;--amb:#9a5b00;--amb-bg:#fff3de;--grn:#1d7a3b;--grn-bg:#e6f4eb;font-size:13.5px}
.cz h1{font-size:18px;margin:0 0 4px}
.cz .sub{color:var(--ink2);margin:0 0 16px}
.cz .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.cz .bar .grow{flex:1}
.cz .btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;font:inherit;color:var(--ink)}
.cz .btn:hover{border-color:#c4cad1;background:var(--mut)}
.cz .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.cz .btn.pri:hover{background:#1a52a6}
.cz .btn.sm{padding:3px 8px;font-size:12px}
.cz .btn.danger{color:var(--red);border-color:#f0c4bf}
.cz input[type=text],.cz input[type=number],.cz input[type=date],.cz input:not([type]),.cz select,.cz textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%;min-width:0}
.cz input:focus,.cz select:focus,.cz textarea:focus{outline:2px solid #bcd3f5;border-color:var(--acc)}
.cz textarea{resize:vertical;min-height:62px;line-height:1.5}
.cz .card h3 .muted{font-weight:400}
.cz .kpi{cursor:pointer}
.cz table.t{width:100%;border-collapse:collapse;background:#fff}
.cz .tw{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:none}
.cz table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap;position:sticky;top:0}
.cz table.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.cz table.t tr.click{cursor:pointer}
.cz table.t tr.ghost td{background:#fbfcfe;border-bottom:1px dashed var(--line)}.cz table.t tr.ghost input[type=text]{border-style:dashed}
.cz table.t tr.click:hover td{background:#f7f9fc}
.cz table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
.cz table.t input,.cz table.t select{padding:4px 6px}
.cz .mono{font-family:Consolas,"D2Coding",monospace;font-size:12.5px}
.cz .badge{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:18px}
.cz .t3{background:#fbe3e1;color:#a52a1f}.cz .t2{background:#fdebd6;color:#9a4f00}.cz .t1{background:#e1edf8;color:#1d5f97}.cz .t0{background:#eceff2;color:#5b6570}
.cz .st-ing{background:var(--acc-bg);color:var(--acc)}.cz .st-hold{background:var(--amb-bg);color:var(--amb)}.cz .st-done{background:var(--grn-bg);color:var(--grn)}.cz .st-cancel{background:#eceff2;color:#7b858f}
.cz .late{color:var(--red);font-weight:600}
.cz .today{color:var(--amb);font-weight:600}
.cz .empty{padding:26px;text-align:center;color:var(--ink3)}
.cz .ball{display:inline-block;min-width:44px;text-align:center;border-radius:10px;padding:0 8px;font-size:12px;line-height:19px;background:#eef1f4;color:var(--ink2)}
.cz .ball.me{background:#1f5fbf;color:#fff}
.cz .chead{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(20,30,40,.04)}
.cz .chead .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cz .chead .r1 select{width:auto}
.cz .chead h2{font-size:17px;margin:0;flex:1;min-width:200px}
.cz .lnk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.cz .stages{display:flex;gap:4px;margin:12px 0 10px;flex-wrap:wrap}
.cz .stg{flex:1;min-width:64px;text-align:center;font-size:12px;padding:5px 2px;border-radius:5px;background:#eef1f4;color:var(--ink3)}
.cz .stg.done{background:var(--grn-bg);color:var(--grn)}
.cz .stg.cur{background:var(--acc);color:#fff;font-weight:600}
.cz .stg.skip{background:transparent;border:1px dashed var(--line);color:#b6bdc4;text-decoration:line-through}
.cz .flow{display:grid;grid-template-columns:130px 1fr 150px auto;gap:8px;align-items:end}
.cz .flow label{font-size:11.5px;color:var(--ink2);display:block;margin-bottom:3px}
.cz .flow .miss{border-color:#e9b766;background:#fffaf0}
.cz .gate{margin-top:12px;background:var(--amb-bg);border:1px solid #f1d9ad;border-radius:8px;padding:10px 14px}
.cz .gate b{color:var(--amb)}
.cz .gate ul{margin:6px 0 0;padding-left:18px}
.cz .gate li{margin:2px 0}
.cz .gate li a{color:var(--ink);cursor:pointer;text-decoration:underline dotted}
.cz .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.cz .tab{padding:8px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.cz .tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.cz .tab .dot{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--amb);margin-left:5px;vertical-align:middle}
.cz .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.cz .fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.cz .fld>input:not([type=checkbox]),.cz .fld>select,.cz .fld>.calc{height:34px;box-sizing:border-box}.cz .fld>.calc{display:flex;align-items:center;gap:6px;min-height:34px;height:auto}
.cz .fld>label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz .fld.w2{grid-column:span 2}.cz .fld.w4{grid-column:1/-1}
.cz .fld .hint{font-size:11.5px;color:var(--ink3);margin-top:3px}
.cz .fld.miss input,.cz .fld.miss select,.cz .fld.miss textarea{border-color:#e9b766;background:#fffaf0}
.cz .checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:4px}
.cz .checks label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);margin:0}
.cz .checks input{width:auto}
.cz .note{background:#f4f7fb;border-left:3px solid #9bbbe6;padding:8px 12px;border-radius:4px;color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.cz .calc{background:#f6f7f9;border:1px solid var(--line2);border-radius:6px;padding:6px 8px;min-height:32px}
.cz .sec-t{font-size:13.5px;font-weight:700;margin:4px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cz .guide{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cz .chip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12.5px;background:#fff;cursor:pointer;color:var(--ink2)}
.cz .chip b{color:var(--acc);font-weight:600}
.cz .chip:hover{border-color:var(--acc)}
.cz .tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.cz .tool{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff;position:relative}
.cz .tool:hover{border-color:var(--acc);background:#fbfdff}
.cz .tool .nm{font-weight:600}
.cz .tool .lv{font-size:11px;color:var(--ink3);margin-left:6px;font-weight:400}
.cz .tool .wh{color:var(--ink2);font-size:12.5px;margin-top:3px;line-height:1.45;padding-right:30px}
.cz .tool .rec{position:absolute;top:8px;right:8px;background:var(--grn-bg);color:var(--grn);font-size:11px;border-radius:4px;padding:0 6px;font-weight:600}
.cz .ws{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;background:#fff}
.cz .ws-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line2);background:#fafbfc;border-radius:10px 10px 0 0}
.cz .ws-b{padding:14px}
.cz .how{background:#f4f7fb;border-left:3px solid #9bbbe6;border-radius:4px;padding:8px 12px 8px 2px;margin-bottom:12px;font-size:12.5px;color:var(--ink2)}
.cz .how ol{margin:0;padding-left:26px}.cz .how li{margin:2px 0;line-height:1.5}
.cz table.mini{width:100%;border-collapse:collapse;margin-bottom:8px}
.cz table.mini th{font-size:12px;color:var(--ink2);text-align:left;font-weight:600;padding:5px 6px;background:#fafbfc;border-bottom:1px solid var(--line);vertical-align:top;position:static}
.cz table.mini td{padding:4px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
.cz table.mini td.num{text-align:right}
.cz table.mini input,.cz table.mini select,.cz table.mini textarea{padding:4px 6px}
.cz .tnode{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cz .tnode input[type=text]{flex:1}
.cz .tnode select{width:auto}
.cz .tl{color:var(--ink3);width:14px;flex:none}
.cz .fbg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.cz .fbc{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fcfcfd}
.cz .fbh{font-weight:600;margin-bottom:6px}
.cz .concl{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.cz .calcv{font-weight:700;color:var(--acc)}
.cz .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.cz .seg a{padding:5px 11px;cursor:pointer;color:var(--ink2);border-right:1px solid var(--line)}
.cz .seg a:last-child{border-right:0}
.cz .seg a.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
.cz .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cz .list-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.cz .list-item:last-child{border-bottom:0}
.cz .list-item .grow{flex:1;min-width:0}
.cz .list-item .t{font-weight:600;cursor:pointer}
.cz .list-item .t:hover{color:var(--acc)}
.cz .list-item .d{color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz .start{text-align:center;padding:40px 20px}
.cz .start h2{margin:0 0 6px}
.cz .start .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.cz .vbox{border:1px solid var(--line);border-radius:8px;margin:0 0 14px;background:#fff}
.cz .vbox>summary{padding:10px 14px;cursor:pointer;list-style:none}.cz .vbox>summary::-webkit-details-marker{display:none}
.cz .vbox>summary::before{content:"▸";display:inline-block;width:12px;color:var(--ink3);transition:transform .15s}.cz .vbox[open]>summary::before{transform:rotate(90deg)}
.cz .vbox .vlist{padding:0 14px;display:flex;flex-direction:column;gap:4px}
.cz .vbox .vrow{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line2)}.cz .vbox .vrow>span:nth-child(2){flex:1;min-width:0}
.cz .vbox .vrow input{width:auto}
.cz .vbox .vsum{padding:10px 14px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.cz .vbox .vbtn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 14px 12px}
.cz .vbox .vshare{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2)}
.cz .vbox .btn:disabled{opacity:.45;cursor:not-allowed}
.cz .lkbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px;background:#fbfcfe}
.cz .lkbox table{width:100%;border-collapse:collapse}.cz .lkbox td,.cz .lkbox th{padding:4px 6px;border-bottom:1px solid var(--line2);font-size:12.5px;position:static}
.cz .lkbox select{width:auto;max-width:460px}
@media (max-width:900px){.cz .tools,.cz .fbg{grid-template-columns:1fr}.cz .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cz .flow{grid-template-columns:1fr 1fr}.cz .two{grid-template-columns:1fr}.cz .chead{position:static}}
@media print{.cz .chead{position:static}}

/* ================= SCAR 관리대장 테마 (화면 전용 · 인쇄 양식은 그대로) =================
   대장(ledger) 구성: 흰 머리글 → 고정 탭 → 요약 지표 줄 → 표. 편집 창은 오른쪽 서류철(drawer) */
:root{--bg:#eef1f3;--card:#fff;--ink:#16202a;--sub:#5b6875;--line:#d5dce2;--line2:#e6ebef;--pri:#1d4f73;--pri-d:#163d5a;--pri2:#e2edf5;
  --ok:#1f7a4d;--okb:#e3f3ea;--warn:#a35f00;--warnb:#fbefd9;--bad:#b3261e;--badb:#fbe4e2;--mut:#e9edf0;--th:#6b7884;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;--f-mono:"IBM Plex Mono",Consolas,"D2Coding",monospace}
body{font-family:var(--f-body);font-size:13.5px;line-height:1.5}
@media screen{
  header{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:12px 22px;gap:14px}
  header h1{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  header h1::before{content:"Quality Management System";display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);font-weight:600;margin-bottom:2px}
  header small{opacity:1;color:var(--sub);font-size:12px}
  .brandlogo{background:transparent;padding:0;border-radius:0}
  nav{background:var(--card);padding:0 16px;gap:4px;position:sticky;top:0;z-index:40}
  nav button{padding:12px 14px;font-weight:500;color:var(--sub);border-bottom-width:3px}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--ink);border-color:var(--pri);font-weight:700}
  main{padding:20px 22px 48px}
  .card{border-color:var(--line);border-radius:8px;padding:16px 18px}
  .card h3{font-size:13.5px;font-weight:700}
  .kpis{gap:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .kpi{border:0;border-radius:0;padding:14px 16px;background:var(--card);box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
  .kpi .l{font-size:12px;color:var(--sub);font-weight:500}
  .kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .kpi .s{font-size:11.5px}
  button.b,label.b{border-color:var(--line);padding:7px 13px;border-radius:6px;font-weight:500}
  button.b:hover,label.b:hover{background:var(--card);border-color:var(--sub)}
  button.p,label.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
  button.p:hover,label.p:hover{background:var(--pri-d);border-color:var(--pri-d)}
  button.s{padding:4px 9px;font-size:12px}
  button.d{color:var(--bad)}
  button.dz{background:var(--bad);border-color:var(--bad)}
  input,select,textarea{border-color:var(--line);border-radius:5px;padding:6px 9px;background:#f7f9fa}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri);background:#fff}
  :focus-visible{outline:2px solid var(--pri);outline-offset:2px}
  th{background:var(--card);color:var(--th);font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom-color:var(--line2)}
  tr:hover td{background:var(--pri2)}
  td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  .tw{border-color:var(--line);border-radius:8px;background:var(--card)}
  th.srt:hover{background:var(--pri2)}
  .bg{border-radius:4px;padding:2px 7px;font-size:11.5px;font-weight:600}
  .bg.mut{background:var(--mut)}
  a.lk{color:var(--pri);font-weight:500}
  .sec{color:var(--pri);font-size:12.5px;letter-spacing:.04em;border-bottom:1px solid var(--line);margin:22px 0 10px;padding-bottom:6px}
  .banner{border-radius:8px}
  .fg label{font-weight:500}
  .route,.fgrp{border-color:var(--line)}
  .route .rh{background:var(--card)}
  ul.logs{border-left-color:var(--line)}
  ul.logs li{background:#f4f6f8}
  #toast,#undo{background:var(--ink)}
  #undo button{color:var(--ink)}
  .cbox{border-radius:10px}
  .cbox .cf,.cbox .cb ul{background:#f4f6f8}
  /* 설정 */
  .snav,.sgrp{background:var(--card)}
  .snav button:hover{background:var(--bg)}
  .snav button.on{background:var(--pri2);color:var(--pri)}
  /* 오른쪽 서류철 편집 창 */
  .modal-bg{padding:0;background:rgba(10,16,22,.42);align-items:stretch;justify-content:flex-end;overflow:hidden}
  .modal{width:min(980px,100%);height:100%;border-radius:0;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(22,32,42,.22);animation:qslide .18s ease-out}
  .modal .mh{padding:16px 22px;background:var(--card);border-bottom-color:var(--line);gap:10px}
  .modal .mh h2{font-size:18px;font-weight:700}
  .modal .mb{flex:1;overflow-y:auto;padding:18px 22px 28px;overscroll-behavior:contain}
  .modal .mf{padding:12px 22px;background:var(--card);border-top-color:var(--line)}
  /* RCA · 사내 8D 화면도 같은 색으로 */
  .cz{--acc:#1d4f73;--acc-bg:#e2edf5;--line2:#e6ebef;--red:#b3261e;--red-bg:#fbe4e2;--grn:#1f7a4d;--grn-bg:#e3f3ea;--amb:#a35f00;--amb-bg:#fbefd9}
  .cz .btn.pri:hover{background:var(--pri-d)}
  .cz .ball.me{background:var(--pri)}
  .cz table.t th,.cz table.mini th{background:var(--card);color:var(--th);letter-spacing:.04em}
  .cz table.t tr.click:hover td{background:var(--pri2)}
  .cz .tw,.cz .chead,.cz .ws{border-radius:8px}
  .cz input:focus,.cz select:focus,.cz textarea:focus{outline:2px solid var(--pri)}
}
/* 표 줄바꿈: 한글 단어는 글자 중간에서 끊지 않고, 짧은 값(날짜·코드·분류·이름)은 한 줄로 */
td,th{word-break:keep-all;overflow-wrap:break-word}
td.nw,td .nwi,td>b:first-child,td>a:first-child>b:first-child{white-space:nowrap}
@media screen{
  /* 표 밀도: 여백·글자 크기를 줄이고, 머리글은 공백에서 두 줄로 */
  .tw table{font-size:13px}
  .tw th{white-space:normal;padding:8px 7px;font-size:11px;line-height:1.3;vertical-align:bottom}
  .tw td{padding:8px 7px}
  .tw td:first-child,.tw th:first-child{padding-left:12px}
  /* 버튼 칸은 좁으면 두 줄로 */
  .tw td.noprint{white-space:normal!important}
  .tw td.noprint:has(.b:nth-of-type(3)){min-width:150px}
  .tw td.noprint .b{margin:1px 0}
  .tw td .b,.tw td .bg{white-space:nowrap}
}
@media screen and (max-width:1366px){
  main{padding-left:14px;padding-right:14px}
  .card{padding-left:12px;padding-right:12px}
  .tw td,.tw th{padding-left:6px;padding-right:6px}
}
/* NCR 화면 전환 (발행 · 통보 / 협력사 회신 / 검증 · 종결) */

.docbox{display:flex;flex-wrap:wrap;gap:8px;padding:4px;border-radius:8px}

.docbox .doc .dn{display:flex;flex-direction:column;min-width:0;max-width:260px}.docbox .doc .dn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.docbox .doc .dn span{font-size:11.5px}

/* 접이식 구역 표시 */
details>summary.sec{list-style:none}

details[open]>summary.sec::before{transform:rotate(90deg)}
details>summary.sec:hover{color:var(--pri-d,#163d5a)}
/* 진행 단계 표시 (NCR 서류철 상단 · 목록) */
.qtrack{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:0 0 16px}
.qtrack div{font-size:11.5px;color:#8a96a1;border-top:3px solid var(--line);padding-top:6px;min-width:0;line-height:1.35}
.qtrack div b{display:block;font-family:var(--f-mono);font-weight:500;font-size:11.5px}

.qstamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);font-weight:700;padding:1px 10px;border-radius:4px;transform:rotate(-4deg);letter-spacing:.1em;font-size:12.5px;margin-left:8px;vertical-align:2px}

@media(max-width:600px){.qtrack{grid-template-columns:repeat(3,minmax(0,1fr))!important;row-gap:10px}header{padding:10px 14px}main{padding:14px}}
@media(prefers-reduced-motion:no-preference){@keyframes qslide{from{transform:translateX(24px);opacity:.6}}}

/* 기준정보 표 */
.mst{table-layout:fixed;width:100%;min-width:860px}.mst th{white-space:nowrap}.mst td.nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bomL{max-height:560px}.bomL table{min-width:0}.bomL tr.bsel{cursor:pointer}.bomL tr.bsel:hover td{background:#f3f7fc}.bomL tr.bsel.on td:not(.bgrp){background:var(--pri2);font-weight:600}

<script>
'use strict';
/* ================= 기본 유틸 ================= */
const KEY='personalQMS_v1';
const COLLS=['suppliers','parts','defects','ncrs','receipts','reviews','cases','actions'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const deb=(fn,ms=200)=>{clearTimeout(deb._t);deb._t=setTimeout(()=>{const own=!sevMemo;if(own)sevMemo=new Map();try{fn()}finally{if(own)sevMemo=null}},ms)};
const isFileURL=u=>typeof u==='string'&&/^data:[\w.+-]+\/[\w.+-]+(;[^,;]*)*;base64,[A-Za-z0-9+/=\s]+$/.test(u);
const isDocRec=p=>!!p&&p.kind==='doc';
const isImgURL=u=>typeof u==='string'&&/^data:image\/(png|jpe?g|gif|webp|bmp);base64,[A-Za-z0-9+/=\s]+$/.test(u);
const jsq=s=>esc(JSON.stringify(String(s??'')));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmtD(new Date());
// ISO(UTC) 시각 → 이 PC 기준 로컬 표시
const loc=(iso,len=16)=>{if(!iso)return '';const d=new Date(iso);if(isNaN(d))return String(iso).slice(0,len).replace('T',' ');return (fmtD(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())).slice(0,len)};
const addDays=(s,n)=>{if(!s)return '';const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+Number(n));return fmtD(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const num=v=>Number(v)||0;
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
/* ---- 통화: 부품 단가는 협력사 통화 그대로 저장하고, 비용(COPQ)은 설정의 환율로 원화 환산 ---- */
const CURS=['KRW','USD','EUR','CNY','JPY','MXN','INR','VND'];
const CUR_L={KRW:'원 (KRW)',USD:'미국 달러 (USD)',EUR:'유로 (EUR)',CNY:'중국 위안 (CNY)',JPY:'일본 엔 (JPY)',MXN:'멕시코 페소 (MXN)',INR:'인도 루피 (INR)',VND:'베트남 동 (VND)'};
const curOf=p=>(p&&p.currency)||'KRW';
const fxRate=c=>!c||c==='KRW'?1:num((db.settings.fx||{})[c]);
const partKRW=p=>{if(!p||p.price===''||p.price==null)return 0;return Math.round(num(p.price)*fxRate(curOf(p))*100)/100};
const fmtAmt=(v,c)=>{c=c||'KRW';if(v===''||v==null)return '';const n=num(v);return c==='KRW'?won(n)+'원':n.toLocaleString('ko-KR',{maximumFractionDigits:4})+' '+c};
const fmtPrice=p=>p&&p.price!==''&&p.price!=null?fmtAmt(p.price,curOf(p)):'';
const sum=(arr,k)=>arr.reduce((a,r)=>a+num(typeof k==='function'?k(r):r[k]),0);
/* ---- 비용 내역 · 구상 ---- */
const COST_CATS=['선별','재작업','폐기','물류/운송','고객클레임','기타'];
const LEGACY_COST=[['c_sort','선별'],['c_rework','재작업'],['c_scrap','폐기'],['c_logistics','물류/운송'],['c_claim','고객클레임'],['c_other','기타']];
const costTotal=d=>(d.costs||[]).reduce((a,c)=>a+num(c.amt),0);
const costsIn=(d,pre)=>(d.costs||[]).filter(c=>(c.date||d.date||'').startsWith(pre));
const costSumIn=(d,pre)=>costsIn(d,pre).reduce((a,c)=>a+num(c.amt),0);
const costCatIn=(d,pre,cat)=>costsIn(d,pre).filter(c=>c.cat===cat).reduce((a,c)=>a+num(c.amt),0);
const CLAIM_CLS={'청구':'inf','합의':'inf','이의':'warn','일부회수':'warn','회수완료':'ok','포기':'mut'};
function claimStatus(d){const c=d.claim;if(!c)return '';if(c.waive)return '포기';const rq=num(c.reqAmt),ag=num(c.agreeAmt),rv=num(c.recvAmt),tgt=ag||rq;
  if(rv>0&&(!tgt||rv>=tgt))return '회수완료';if(rv>0)return '일부회수';if(c.dispute)return '이의';if(ag)return '합의';if(rq)return '청구';return ''}
const recvOf=d=>num(d.claim?.recvAmt);
const recvDateOf=d=>d.claim?.recvDate||d.claim?.agreeDate||d.claim?.reqDate||d.date||'';
const recvIn=(d,pre)=>recvDateOf(d).startsWith(pre)?recvOf(d):0;
function outstanding(d){const st=claimStatus(d);if(!['청구','합의','이의','일부회수'].includes(st))return 0;const c=d.claim;return Math.max(0,(num(c.agreeAmt)||num(c.reqAmt))-num(c.recvAmt))}
const allCostIn=pre=>db.defects.reduce((a,d)=>a+costSumIn(d,pre),0);
const allRecvIn=pre=>db.defects.reduce((a,d)=>a+recvIn(d,pre),0);
const costRange=(d,f,t)=>(d.costs||[]).filter(c=>{const x=c.date||d.date||'';return x>=f&&x<=t}).reduce((a,c)=>a+num(c.amt),0);
const recvRange=(d,f,t)=>{const x=recvDateOf(d);return x>=f&&x<=t?recvOf(d):0};
const needCost=d=>isDone(d)&&!(d.costs||[]).length&&!d.noCost;
const shareOf=d=>d.resp==='공동'?Math.max(0,Math.min(100,num(d.inv?.share)))/100:1;
const needClaim=d=>(d.resp==='협력사'||(d.resp==='공동'&&shareOf(d)>0))&&costTotal(d)>0&&!claimStatus(d);
function migrateCosts(x){
  if(!Array.isArray(x.costs)){x.costs=[];
    LEGACY_COST.forEach(([k,cat])=>{const v=num(x[k]);if(v>0)x.costs.push({id:uid(),date:x.date||'',cat,amt:v,basis:(k==='c_sort'||k==='c_rework')&&num(x.hours)?`${x.hours}h × 인건비`:'',memo:'이전 입력분'})});}
  LEGACY_COST.forEach(([k])=>delete x[k]);
  if(!x.claim&&num(x.recovered)>0)x.claim={reqDate:x.date||'',reqAmt:num(x.recovered),recvDate:x.date||'',recvAmt:num(x.recovered),method:'입금',memo:'이전 입력분'};
  delete x.recovered;
}
const isExt=d=>stageOf(d.source)===4;
const D8=[['d1','D1 팀 구성'],['d2','D2 문제 기술 (5W2H)'],['d3','D3 임시조치 (봉쇄)'],['d4','D4 근본원인 (발생원인 / 유출원인)'],['d5','D5 영구대책 선정'],['d6','D6 영구대책 실행 및 효과 확인'],['d7','D7 재발방지 (표준화 · FMEA/CP 반영)'],['d8','D8 종결 및 팀 치하']];

function defaultDB(){return{
  meta:{version:1,created:now(),saved:null,lastBackup:null},
  settings:{
    defectTypes:['치수','외관(스크래치)','외관(찍힘/변형)','이물','녹/부식','기능불량','소음/NVH','오삽/혼입','누락/결품','포장불량','기타'],
    sources:['수입검사','공정','출하검사','고객(클레임)'],
    dispositions:['반품','선별','재작업','특채','폐기'],
    owners:[],
    ncrRepeat:3,ncrQty:50,repeatWindow:90,requestDays:2,replyDays:7,verifyDays:21,backupDays:7,farDays:5,ntfDays:30,
    laborRate:30000,fx:{USD:1400,EUR:1610,CNY:195,JPY:9.3,MXN:75,INR:16.5,VND:0.055},fxDate:'',gradeA:100,gradeB:500,gradeC:1000,photoMax:1600,photoQ:80,backupKeep:30,backupPhotos:1,company:'',dept:'',logo:'',ncrFormat:'NCR-{YY}{MM}-{SEQ3}',issuerPhone:'',issuerEmail:'',approver:'',signs:{},evalPass:80,evalCond:60,sevA:12,sevB:8,reply8D:7,replySimple:5,d3Days:1,escCount:2,ppmScar:1000,ppmScarMonths:3,impactMap:{'치수':3,'외관(스크래치)':1,'외관(찍힘/변형)':2,'이물':2,'녹/부식':2,'기능불량':3,'소음/NVH':3,'오삽/혼입':3,'누락/결품':3,'포장불량':1,'기타':2}
  },
  suppliers:[],parts:[],defects:[],ncrs:[],receipts:[],reviews:[],cases:[],actions:[],deleted:[],bom:{updatedAt:'',rows:[]}
}}
function migrate(d){
  const def=defaultDB();d=d||{};
  d.meta={...def.meta,...(d.meta||{})};
  if(!d.bom||!Array.isArray(d.bom.rows))d.bom={updatedAt:'',rows:[]};
  if(!d.bom.fg||typeof d.bom.fg!=='object'||Array.isArray(d.bom.fg))d.bom.fg={};
  d.settings={...def.settings,...(d.settings&&typeof d.settings==='object'?d.settings:{})};
  Object.keys(def.settings).forEach(k=>{const dv=def.settings[k],v=d.settings[k];
    if(Array.isArray(dv)){if(!Array.isArray(v))d.settings[k]=dv;else d.settings[k]=v.filter(x=>x!=null&&x!=='').map(String)}
    else if(dv&&typeof dv==='object'){if(!v||typeof v!=='object'||Array.isArray(v))d.settings[k]=dv}
    else if(typeof dv==='number'&&(v===''||v==null||!isFinite(Number(v))))d.settings[k]=dv});
  COLLS.forEach(c=>{d[c]=Array.isArray(d[c])?d[c].filter(r=>r&&typeof r==='object'&&!Array.isArray(r)):[];d[c].forEach(r=>{if(!r.id)r.id=uid()})});
  d.deleted=Array.isArray(d.deleted)?d.deleted.filter(t=>t&&t.id):[];
  if(d.settings.logo&&!isImgURL(d.settings.logo))d.settings.logo='';
  Object.keys(d.settings.signs).forEach(k=>{if(!isImgURL(d.settings.signs[k]))delete d.settings.signs[k]});
  d.suppliers.forEach(ensureContacts);
  // 이름이 '코드: 이름'으로 잘못 들어간 협력사 → 같은 코드 협력사로 합치거나, 코드와 이름으로 나눔
  {const rx=/^\[?([A-Za-z0-9-]{2,})\]?\s*[:：]\s*(.+)$/,drop=new Map();
   d.suppliers.forEach(s=>{const m=!s.code&&String(s.name||'').trim().match(rx);if(!m)return;
     const real=d.suppliers.find(x=>x!==s&&x.code&&String(x.code)===m[1]);
     if(real)drop.set(s.id,real.id);else{s.code=m[1];s.name=m[2].trim()}});
   if(drop.size){const fix=o=>{['supplierId','SupplierId','causeSupplierId'].forEach(k=>{if(o&&drop.has(o[k]))o[k]=drop.get(o[k])})};
     COLLS.forEach(c=>(d[c]||[]).forEach(fix));
     d.suppliers=d.suppliers.filter(s=>!drop.has(s.id));drop.forEach((_,id)=>d.deleted.push({id,at:new Date().toISOString()}))}}
  d.ncrs.forEach(n=>{if(n.reqType==='통보만 (회신 불요)')n.reqType='단순 통보';if(!('notifyDate' in n))n.notifyDate=n.requestDate||n.issueDate||'';
    if(n.reqType!=='단순 통보'&&!n.requestDate&&n.issueDate&&!n.replyDate&&!n.verifyDate){n.requestDate=n.issueDate;if(!n.dueDate)n.dueDate=addDays(n.issueDate,typeDays(n.reqType,d.settings))}});
  d.defects.forEach(x=>{if(!x.delivDate&&x.lot&&/^(\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2}|20\d{6})$/.test(String(x.lot).trim())){const p=parseDateAny(String(x.lot).trim());if(p)x.delivDate=p}if(!Array.isArray(x.photos))x.photos=[];migrateCosts(x)});
  // 이전 통합본(원인 부품 칸 · 불량 FAR · 귀책 확정 기록) → 발견 품목 + 원인 부품번호 · 귀책 조사 구조로
  d.defects.forEach(x=>{

/* ---- 문서번호: 설정 › 문서번호의 형식 · 일련번호 초기화 기준으로 발행 ---- */
const DOCNO={
  ncr:{label:'NCR',key:'ncrFormat',rk:'ncrReset',def:'NCR-{YY}{MM}-{SEQ3}'},
  rca:{label:'RCA',key:'rcaFormat',rk:'rcaReset',def:'RCA-{YYYY}{MM}{DD}-{SEQ4}'},
  i8d:{label:'사내 8D',key:'i8dFormat',rk:'i8dReset',def:'I8D-{YYYY}{MM}{DD}-{SEQ4}'}};
const DOC_RESETS=[['auto','형식에 따름'],['year','매년'],['month','매월'],['day','매일'],['none','초기화 안 함']];
function fmtNo(f,date){return f.replace(/\{YYYY\}/g,date.slice(0,4)).replace(/\{YYY\}/g,date.slice(1,4)).replace(/\{YY\}/g,date.slice(2,4)).replace(/\{MM\}/g,date.slice(5,7)).replace(/\{DD\}/g,date.slice(8,10))}
function docFmt(k){const d=DOCNO[k];let f=String(db.settings[d.key]||d.def).trim();if(!/\{SEQ\d\}/.test(f))f+='-{SEQ3}';return f}
function docReset(k,f){let r=db.settings[DOCNO[k].rk]||(k==='ncr'?'auto':'none');
  if(r==='auto')r=/\{DD\}/.test(f)?'day':/\{MM\}/.test(f)?'month':/\{Y{2,4}\}/.test(f)?'year':'none';return r}
const docPer=(d,r)=>r==='day'?d.slice(0,10):r==='month'?d.slice(0,7):r==='year'?d.slice(0,4):'';
function docRegex(f){
  const W={YYYY:4,YYY:3,YY:2,MM:2,DD:2},re=/\{(YYYY|YYY|YY|MM|DD|SEQ\d)\}/g,q=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  let src='',i=0,m,first=true;
  while((m=re.exec(f))){src+=q(f.slice(i,m.index));src+=m[1].startsWith('SEQ')?(first?(first=false,'(\\d+)'):'\\d+'):`\\d{${W[m[1]]}}`;i=re.lastIndex}
  return new RegExp('^'+src+q(f.slice(i))+'$');
}
function genDocNo(k,date){
  date=date||today();
  const f=docFmt(k),r=docReset(k,f),rx=docRegex(f),pk=docPer(date,r),w=+/\{SEQ(\d)\}/.exec(f)[1];
  const recs=k==='ncr'?db.ncrs.map(n=>[n.no,n.issueDate]):db.cases.map(c=>[c.CaseNo,c.Created]);
  let mx=0;recs.forEach(([no,d])=>{const m=rx.exec(no||'');if(m&&docPer(String(d||''),r)===pk)mx=Math.max(mx,parseInt(m[1])||0)});
  if(k!=='ncr'&&r==='none')mx=Math.max(mx,num(db.meta.caseSeq));  // 지운 RCA 번호를 다시 쓰지 않음
  const used=new Set(recs.map(x=>x[0]));let no;
  do{mx++;no=fmtNo(f,date).replace(/\{SEQ\d\}/g,String(mx).padStart(w,'0'))}while(used.has(no));
  return {no,seq:mx};
}
function genNcrNo(date){return genDocNo('ncr',date).no}

function barChart(labels,series,opts={}){return chartBox(W=>barSvg(labels,series,opts,W),opts.h||230)}
function barSvg(labels,series,{h=230,fmt=v=>v.toLocaleString()}={},W=620){
  const H=h,pl=58,pr=10,pt=20,pb=series.length>1?50:34;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const gw=(W-pl-pr)/labels.length,bw=Math.min(30,(gw-6)/series.length);
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,y=pt+(H-pt-pb)*(1-i/4);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e6ebef"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11.5" fill="#5b6875">${fmtShort(v)}</text>`}
  labels.forEach((lb,i)=>{
    const cx=pl+gw*i+gw/2;
    series.forEach((s,j)=>{
      const v=s.values[i]||0,bh=(H-pt-pb)*v/max,x=cx-bw*series.length/2+bw*j,y=H-pb-bh;
      g+=`<rect x="${x}" y="${y}" width="${Math.max(1,bw-2)}" height="${bh}" fill="${s.color}" rx="2"><title>${esc(lb)} ${esc(s.name)}: ${fmt(v)}</title></rect>`;
      if(series.length===1&&v)g+=`<text x="${x+(bw-2)/2}" y="${y-4}" text-anchor="middle" font-size="11.5" fill="#16202a">${fmtShort(v)}</text>`;
    });
    g+=`<text x="${cx}" y="${H-pb+14}" text-anchor="middle" font-size="11.5" fill="#5b6875">${esc(lb)}</text>`;
  });
  if(series.length>1){let lx=pl;series.forEach(s=>{g+=`<rect x="${lx}" y="${H-16}" width="10" height="10" fill="${s.color}"/><text x="${lx+14}" y="${H-7}" font-size="12" fill="#16202a">${esc(s.name)}</text>`;lx+=14+s.name.length*13+24})}
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg>`;
}
function pareto(map,unit=''){
  if(!Object.values(map).some(v=>v>0))return '<div class="muted" style="padding:40px;text-align:center">해당 기간 데이터 없음</div>';
  return chartBox(W=>paretoSvg(map,unit,W),250);
}
function paretoSvg(map,unit='',W=620){
  const items=Object.entries(map).map(([k,v])=>({k,v})).filter(i=>i.v>0).sort((a,b)=>b.v-a.v);
  if(!items.length)return '<div class="muted" style="padding:40px;text-align:center">해당 기간 데이터 없음</div>';
  const tot=items.reduce((a,i)=>a+i.v,0),top=items.slice(0,8);
  const H=250,pl=48,pr=40,pt=18,pb=52,max=top[0].v,gw=(W-pl-pr)/top.length,ih=H-pt-pb;
  let g='',cum=0;const pts=[];
  for(let i=0;i<=4;i++){const y=pt+ih*(1-i/4);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e6ebef"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11.5" fill="#5b6875">${fmtShort(max*i/4)}</text><text x="${W-pr+6}" y="${y+4}" font-size="11.5" fill="#c0392b">${i*25}%</text>`}
  top.forEach((it,i)=>{
    const x=pl+gw*i,bh=ih*it.v/max,bw=Math.min(46,gw-10);
    g+=`<rect x="${x+(gw-bw)/2}" y="${pt+ih-bh}" width="${bw}" height="${bh}" fill="#1f5fbf" rx="2"><title>${esc(it.k)}: ${it.v.toLocaleString()}${unit}</title></rect>`;
    g+=`<text x="${x+gw/2}" y="${pt+ih-bh-4}" text-anchor="middle" font-size="11.5" fill="#16202a">${fmtShort(it.v)}</text>`;
    const lb=it.k.length>7?it.k.slice(0,7)+'…':it.k;
    g+=`<text x="${x+gw/2}" y="${H-pb+15}" text-anchor="middle" font-size="11.5" fill="#16202a">${esc(lb)}</text>`;
    cum+=it.v;pts.push([x+gw/2,pt+ih*(1-cum/tot),Math.round(cum/tot*100)]);
  });
  g+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#c0392b" stroke-width="2"/>`;
  pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#c0392b"/><text x="${p[0]}" y="${p[1]-6}" text-anchor="middle" font-size="10.5" fill="#c0392b">${p[2]}%</text>`);
  if(items.length>8)g+=`<text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11.5" fill="#5b6875">외 ${items.length-8}개 항목 (누적%는 전체 기준)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg>`;
}

const getReview=m=>db.reviews.find(r=>r.month===m);

function onReview(m,field,val){

}
function autoSummary(m){
  const pm=lastMonths(m,2)[0],ds=db.defects.filter(d=>(d.date||'').startsWith(m)),pds=db.defects.filter(d=>(d.date||'').startsWith(pm));
  const L=[];const sg=(a,b)=>a===b?'전월 동일':`전월 대비 ${a>b?'+':''}${(a-b).toLocaleString()}`;
  L.push(`• 불량 ${ds.length}건 / ${sum(ds,'qty').toLocaleString()}개 (${sg(ds.length,pds.length)}건, ${sg(sum(ds,'qty'),sum(pds,'qty'))}개)`);
  {const g={A:0,B:0,C:0};ds.forEach(d=>g[sevOf(d).grade]++);L.push(`• 심각도: A ${g.A}건 (8D) · B ${g.B}건 (간이 대책서) · C ${g.C}건 (단순 통보)`)}
  const sm={};ds.forEach(d=>{const k=supName(d.supplierId)||'(미지정)';sm[k]=(sm[k]||0)+num(d.qty)});
  const ts=Object.entries(sm).sort((a,b)=>b[1]-a[1]),tq=sum(ds,'qty');
  if(ts.length)L.push(`• 협력사별: ${ts.slice(0,3).map(([k,v])=>`${k} ${v.toLocaleString()}개(${tq?Math.round(v/tq*100):0}%)`).join(', ')}`);
  const tm={};ds.forEach(d=>{tm[d.type||'(미지정)']=(tm[d.type||'(미지정)']||0)+1});
  const tt=Object.entries(tm).sort((a,b)=>b[1]-a[1]);
  if(tt.length)L.push(`• 주요 유형: ${tt.slice(0,3).map(([k,v])=>`${k} ${v}건`).join(', ')}`);
  const big=[...ds].sort((a,b)=>num(b.qty)-num(a.qty))[0];
  if(big&&num(big.qty)>=num(db.settings.ncrQty))L.push(`• 다량 불량: ${big.date} ${supName(big.supplierId)} ${big.partName||big.partNo} ${big.type} ${num(big.qty)}개`);
  const ext=ds.filter(isExt);if(ext.length)L.push(`• 고객 클레임 ${ext.length}건 (비용 ${won(sum(ext,costTotal))}원)`);
  const cost=allCostIn(m),rec=allRecvIn(m);{const os=db.defects.reduce((a,d)=>a+outstanding(d),0);if(os)L.push(`• 구상 미회수 잔액 ${won(os)}원`)}if(cost)L.push(`• 실패비용(당월 발생) ${won(cost)}원, 구상 회수 ${won(rec)}원 (${Math.round(rec/cost*100)}%)`);
  const open=db.ncrs.filter(n=>ncrStatus(n)!=='종결'),rl=open.filter(n=>ncrFlags(n).replyLate),vl=open.filter(n=>ncrFlags(n).verifyLate);
  L.push(`• 미종결 NCR ${open.length}건${rl.length?` — 회신 지연 ${rl.length}건(${[...new Set(rl.map(n=>supName(n.supplierId)))].join(', ')})`:''}${vl.length?`, 유효성 검증 지연 ${vl.length}건`:''}`);
  const recs=db.defects.filter(d=>!d.ncrId&&d.date&&diffDays(d.date,today())<=90&&ncrReasons(d).length);
  if(recs.length)L.push(`• NCR 발행 권고 미처리 ${recs.length}건 (최근 90일)`);
  return L.join('\n');
}

function filteredDefects(){
  const f=state.df,q=f.q.toLowerCase();

    &&(!q||[d.partNo,d.partName,d.fgNo,d.fgName,d.model,d.lot,d.delivDate,d.desc,d.inv?.farResult,d.inv?.rca,...(d.logs||[]).map(l=>l.text),supName(d.supplierId),d.owner,d.source].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));

function ncrCell(d){
  const n=d.ncrId&&db.ncrs.find(x=>x.id===d.ncrId);
  if(n)return `<a class="bg inf" onclick="editNcr('${n.id}')" style="cursor:pointer">${esc(n.no)}</a>`;
  if(invOpen(d))return `<a class="bg inf" style="cursor:pointer" onclick="editDefect('${d.id}')" title="귀책 조사 중 — FAR·RCA 후 판정">조사 중</a>`;
  if(d.resp==='사내')return `<span class="bg mut" title="사내 귀책 — 사내 대책으로 처리">사내</span>`;
  if(d.resp==='미정'&&d.inv?.verdict==='원인 불명')return `<span class="bg mut">원인 불명</span>`;
  const r=ncrReasons(d);

  if(n)line('NCR',`<a class="bg inf" onclick="editNcr('${n.id}')">${esc(n.no)}</a> <span class="muted" style="font-size:11.5px">${esc(ncrStatus(n))}</span>`);

  return L.join('')||(r==='고객'?'<span class="bg mut">고객 귀책</span>':'<span class="muted">-</span>');

async function offerNcrAfterVerdict(ids,v){

  const sid=ds[0].supplierId,same=ds.filter(d=>d.supplierId===sid),rest=ds.length-same.length;
  const g=same.map(d=>sevOf(d).grade).sort()[0],rt=RESP[g];
  const far=same.some(d=>d.inv&&d.inv.farReq);
  const ok=await askConfirm({title:'이어서 NCR을 발행할까요?',danger:false,ok:'이어서 NCR 발행',cancel:'나중에',
    msg:`${v==='공동'?'공동 귀책 — 협력사 몫의 ':'협력사 귀책 — '}원인과 재발 방지 대책은 NCR로 요구합니다.`,

      .concat(far?['귀책 조사의 FAR 내용이 NCR ‘불량 분석 요청’으로 넘어갑니다']:[])
      .concat(rest?[`다른 협력사 불량 ${rest}건은 각 불량 화면에서 따로 발행하세요`]:[]),
    note:'나중에 발행하려면 불량 목록의 ‘NCR 발행 필요’ 또는 대시보드의 NCR 권고에서 할 수 있습니다.'});
  if(ok)ncrFromDefect(same[0].id,same.slice(1).map(d=>d.id));
}

function saveInv(id,keep){

  iv.costNotice=!!o.inv_costNotice;
  if(invCurId===id)iv.photoExcl=[...curInvExcl];

  if(iv.farReq&&!iv.farDue)iv.farDue=addBiz(iv.farReq,num(db.settings.farDays)||5);
  if(iv.verdict==='공동'&&(iv.share===''||iv.share==null)){toast('공동 귀책은 협력사 부담 비율을 입력하세요');return false}

  if(iv.verdict){if(!iv.verdictDate)iv.verdictDate=today();d.resp=VERDICT_RESP[iv.verdict]||d.resp}
  else{iv.verdictDate='';if(prev&&d.resp!=='미정')d.resp='미정'}

  if(!keep)closeModal(true);render();

}

async function inflateRaw(u8){
  if(!window.DecompressionStream)throw new Error('이 브라우저는 xlsx 읽기를 지원하지 않습니다. CSV로 저장하거나 붙여넣기를 이용하세요.');

function unzip(buf){

  if(e<0)throw new Error('xlsx 형식이 아닙니다 (구버전 .xls는 엑셀에서 “다른 이름으로 저장 → .xlsx” 후 사용하세요)');
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    const method=v.getUint16(p+10,true),csize=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    files[td.decode(u.subarray(p+46,p+46+nl))]={method,csize,off};p+=46+nl+xl+cl;

  return async name=>{const f=files[name];if(!f)return null;
    const st=f.off+30+v.getUint16(f.off+26,true)+v.getUint16(f.off+28,true),data=u.subarray(st,st+f.csize);

function parseCSV(t){

function supStats(from,to){
  const S=db.settings,ds=db.defects.filter(d=>d.date>=from&&d.date<=to),mf=from.slice(0,7),mt=to.slice(0,7);
  return db.suppliers.map(s=>{
    const my=ds.filter(d=>d.supplierId===s.id),sq=my.filter(d=>!d.resp||d.resp==='협력사'||d.resp==='공동');
    const qty=sum(sq,'qty');
    const rcv=rcvSumRange(s.id,mf,mt);
    const ppm=rcv?qty/rcv*1e6:null;
    const ns=db.ncrs.filter(n=>n.supplierId===s.id&&n.issueDate>=from&&n.issueDate<=to);
    const replied=ns.filter(n=>n.requestDate&&n.replyDate);
    const avgReply=replied.length?replied.reduce((a,n)=>a+diffDays(n.requestDate,n.replyDate),0)/replied.length:null;
    const late=ns.filter(n=>ncrFlags(n).replyLate||(n.replyDate&&n.dueDate&&n.replyDate>n.dueDate)).length;
    const grade=ppm==null?'-':ppm<=S.gradeA?'A':ppm<=S.gradeB?'B':ppm<=S.gradeC?'C':'D';
    const evs=ns.map(latestEval).filter(Boolean),firstEv=ns.map(n=>(n.evals||[]).find(evalDone)).filter(Boolean);
    const avgEval=evs.length?evs.reduce((a,e)=>a+evalScore(e),0)/evs.length:null,firstPass=firstEv.length?firstEv.filter(e=>evalVerdict(e)==='승인').length/firstEv.length:null;
    const nA=sq.filter(d=>sevOf(d).grade==='A').length;
    const pen=ns.reduce((a,n)=>a+num(n.penalty),0),escN=ns.filter(n=>ncrRejects(n)>=(num(S.escCount)||2)).length;
    return {s,nA,pen,escN,avgEval,firstPass,nEval:evs.length,cnt:sq.length,qty,rcv,ppm,ncr:ns.length,open:ns.filter(n=>ncrStatus(n)!=='종결').length,late,avgReply,cost:db.defects.filter(d=>d.supplierId===s.id).reduce((a,d)=>a+costRange(d,from,to),0),rec:db.defects.filter(d=>d.supplierId===s.id).reduce((a,d)=>a+recvRange(d,from,to),0),os:db.defects.filter(d=>d.supplierId===s.id).reduce((a,d)=>a+outstanding(d),0),grade};
  }).sort((a,b)=>b.qty-a.qty||b.cnt-a.cnt||a.s.name.localeCompare(b.s.name,'ko'));
}

  ['date','입고일자',['입고일','입고일자','일자','날짜','전기일','입고일시','date']],
  ['month','월',['월','년월','입고월','기준월','연월','month']],

function parseMonthAny(v,year){

  if((m=/^(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*월?$/.exec(s)))return `${m[1]}-${pad(+m[2])}`;
  if((m=/^(\d{4})(\d{2})$/.exec(s))&&+m[2]>=1&&+m[2]<=12)return `${m[1]}-${m[2]}`;
  if((m=/^(\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*월?$/.exec(s)))return `20${m[1]}-${pad(+m[2])}`;
  if((m=/^(\d{1,2})\s*월$/.exec(s))&&year&&+m[1]<=12)return `${year}-${pad(+m[1])}`;

  if(!await askConfirm({title:`${c.name||'이 담당자'}를 담당 해제할까요?`,msg:'퇴사·업무 변경 등으로 더 이상 담당하지 않을 때 사용합니다. 연락처는 <b>‘이전 담당자’로 보존</b>되고 이력에 기록됩니다.',ok:'담당 해제',danger:false}))return;
  c.active=false;c.until=today();
  if(c.primary){c.primary=false;const n=curContacts.find(x=>x.active!==false);if(n)n.primary=true}
  mfDirty=true;renderContacts();
}
function reactivate(i){const c=curContacts[i];c.active=true;c.until='';if(!curContacts.some(x=>x.active!==false&&x.primary))c.primary=true;mfDirty=true;renderContacts()}

const C_FIELDS=[['role','역할'],['name','이름'],['dept','부서/직급'],['phone','전화'],['mobile','휴대폰'],['email','이메일'],['note','비고']];
function diffContacts(oldL,newL,events){
  const out=[...events.map(e=>({at:e.at,text:e.text}))],skip=new Set(events.flatMap(e=>e.ids)),om=new Map(oldL.map(c=>[c.id,c])),nm=new Map(newL.map(c=>[c.id,c]));
  newL.forEach(c=>{
    if(skip.has(c.id))return;const o=om.get(c.id);
    if(!o){out.push({at:c.since||today(),text:`[추가] ${cLabel(c)}${c.primary?' — 주담당':''}${c.phone||c.mobile?` · ${c.mobile||c.phone}`:''}${c.email?` · ${c.email}`:''}`});return}
    const ch=C_FIELDS.filter(([k])=>(o[k]||'')!==(c[k]||'')).map(([k,l])=>`${l} ${o[k]||'(없음)'} → ${c[k]||'(없음)'}`);
    if(ch.length)out.push({at:today(),text:`[수정] ${o.name}: ${ch.join(', ')}`});
    if(o.active!==false&&c.active===false)out.push({at:c.until||today(),text:`[담당 해제] ${cLabel(c)}`});
    if(o.active===false&&c.active!==false)out.push({at:today(),text:`[복귀] ${cLabel(c)}`});
  });
  oldL.forEach(o=>{if(!nm.has(o.id)&&!skip.has(o.id))out.push({at:today(),text:`[삭제] ${cLabel(o)}${o.mobile||o.phone?` · ${o.mobile||o.phone}`:''}`})});
  const op=oldL.find(c=>c.primary&&c.active!==false),np=newL.find(c=>c.primary&&c.active!==false);
  if((op?.id||'')!==(np?.id||'')&&!(np&&!om.has(np.id))&&!events.some(e=>e.ids.includes(np?.id)))out.push({at:today(),text:`[주담당 변경] ${op?op.name:'(없음)'} → ${np?np.name:'(없음)'}`});
  return out;
}
function saveSup(id){
  const o=gather();if(!o.name){toast('협력사명을 입력하세요');return}
  o.country=String(o.country||'').trim().toUpperCase();if(!o.region)o.region=countryRegion(o.country);
  if(db.suppliers.some(x=>x.name===o.name&&x.id!==id)){toast('같은 이름의 협력사가 이미 있습니다');return}
  const empty=curContacts.filter(c=>!c.name.trim()&&(c.phone||c.mobile||c.email));
  if(empty.length){toast('이름이 없는 연락처가 있습니다');return}
  const list=curContacts.filter(c=>c.name.trim()).map(c=>({...c,name:c.name.trim()}));
  if(list.some(c=>c.active!==false)&&!list.some(c=>c.active!==false&&c.primary))list.find(c=>c.active!==false).primary=true;
  const reason=(o.chgReason||'').trim();delete o.chgReason;
  let sp;if(id){sp=supById(id);Object.assign(sp,o)}else{sp={id:uid(),...o,contactLog:[]};db.suppliers.push(sp)}
  const entries=diffContacts(id?origContacts:[],list,curEvents);
  sp.contacts=list;ensureContacts(sp);
  entries.forEach(e=>sp.contactLog.push({id:uid(),at:e.at,ts:now(),text:e.text,reason}));
  syncLegacy(sp);touch(sp);save();closeModal(true);render();
  if(entries.length)toast(`저장됨 · 연락처 이력 ${entries.length}건 기록`);
}

function importContact(s,name,phone,email,dept){
  const isMob=v=>/^(\+?82[\s-]*)?0?1[016789][\s-]?\d{3,4}[\s-]?\d{4}$/.test(String(v||'').trim());
  const p=primaryOf(s),log=t=>s.contactLog.push({id:uid(),at:today(),ts:now(),text:t,reason:'엑셀 일괄 등록'});
  const act=s.contacts.filter(c=>c.active!==false);
  const same=act.find(c=>c.name===name);
  if(same){const ch=[];if(phone&&phone!==(same.mobile||same.phone)){ch.push(`전화 ${same.mobile||same.phone||'(없음)'} → ${phone}`);if(isMob(phone))same.mobile=phone;else same.phone=phone}
    if(dept&&dept!==same.dept){ch.push(`부서 ${same.dept||'(없음)'} → ${dept}`);same.dept=dept}
    if(email&&email!==same.email){ch.push(`이메일 ${same.email||'(없음)'} → ${email}`);same.email=email}
    if(ch.length)log(`[수정] ${name}: ${ch.join(', ')}`);
    if(!same.primary){s.contacts.forEach(c=>c.primary=c===same);log(`[주담당 변경] ${p?p.name:'(없음)'} → ${name}`)}
    return}
  const role=roleOfDept(dept),tgt=act.find(c=>c.role===role&&c.primary)||act.find(c=>c.role===role);
  const nc=newContact({role,name,dept:dept||'',...(isMob(phone)?{mobile:phone}:{phone}),email,primary:true});
  if(tgt){tgt.active=false;tgt.until=today();log(`[교체] ${role}: ${tgt.name} → ${name} (주담당)`)}
  else log(`[추가] ${cLabel(nc)} — 주담당${p?` (기존 주담당 ${p.name}은 연락처 유지)`:''}`);
  s.contacts.forEach(c=>c.primary=false);s.contacts.push(nc);
}

/* ================= BOM (다단계: MES 'BOM 구성현황' 형식) =================

const bomQ=v=>v===''||v==null?'-':String(+(+v).toFixed(4));

    ['partName',c=>/(자품|하위|구성품|부품|자재|투입|component|child|part|item).*(명|name)|^품명$|description|규격/.test(c)],

  const fgKeep=bi.mode==='all'?{}:Object.fromEntries(Object.entries(db.bom.fg||{}).filter(([k])=>!fgs.has(k)));

  const oldFg=db.bom.fg||{},newFg={};Object.entries(D.fg).forEach(([k,v])=>{const o={...(bi.mode==='all'?{}:oldFg[k]||{})};Object.entries(v).forEach(([kk,vv])=>{if(vv)o[kk]=vv});newFg[k]=o});  // 제품 목록으로 넣은 적용일자 등은 유지
  db.bom={updatedAt:now(),rows:[...keep,...D.rows.map(r=>({...r,seq:r.seq+base}))],fg:{...fgKeep,...newFg}};
  msState.bomSel=[...fgs][0];
  save();closeModal(true);render();
  toast(`BOM 등록: 제품 ${fgs.size}개 · ${D.rows.length}줄${keep.length?` (기존 제품 ${new Set(keep.map(r=>r.fgNo)).size}개 유지)`:''}`);
  offerUndo(snap,`BOM 업로드: 제품 ${fgs.size}개`);
}

async function applyPhotos(photos,replace){

  // 사진 정보만 온 경우: 이 PC에 이미 있는 사진은 그대로 쓰고, 없으면 자리표시로 두었다가 사진 폴더에서 불러온다
  const have={},metaIds=photos.filter(phIsPending).map(p=>p.id);
  if(metaIds.length){try{(await photoGetMany(metaIds)).forEach(r=>{if(!phIsPending(r))have[r.id]=r})}catch(e){}}
  photos=photos.map(p=>{
    if(!phIsPending(p))return isDocRec(p)?{...p,thumb:''}:{...p,thumb:isImgURL(p.thumb)?p.thumb:p.data};
    const h=have[p.id];
    return h?{...p,data:h.data,thumb:h.thumb}:{...p,data:PH_IMG,thumb:PH_IMG,pending:true};
  });
  if(replace)await photoClear();
  if(photos.length)await photoPut(photos);
  phPendAdd(photos.filter(p=>p.pending).map(p=>p.id));
  photoStr=null;
  if(photoDir)setTimeout(()=>syncPhotoFiles(true),0);
  return photos.length;
}

// 같은 기록을 양쪽에서 고친 경우: 최신 기록을 기준으로 하되 진행기록·비용·평가·연락처 같은 목록은 항목(id)별로 합침
const MERGE_ARR=['logs','costs','evals','contacts','contactLog','Analyses'];
const itemTime=x=>String(x&&(x.updatedAt||x.edited||x.at||x.ts||x.date)||'');
function mergeRec(base,oth){
  const rec={...base};let changed=false;
  MERGE_ARR.forEach(k=>{const A=Array.isArray(base[k])?base[k]:null,B=Array.isArray(oth[k])?oth[k]:null;if(!B||!B.length)return;
    const out=(A||[]).map(x=>{if(!x||!x.id)return x;const y=B.find(z=>z&&z.id===x.id);return y&&itemTime(y)>itemTime(x)?(changed=true,y):x});
    B.forEach(y=>{if(y&&y.id&&!out.some(x=>x&&x.id===y.id)){out.push(y);changed=true}});
    rec[k]=out});
  if(!rec.claim&&oth.claim){rec.claim=oth.claim;changed=true}
  if(Array.isArray(oth.photos)&&oth.photos.some(i=>!(rec.photos||[]).includes(i))){rec.photos=[...new Set([...(rec.photos||[]),...oth.photos])];changed=true}
  return {rec,changed};
}
function relinkNcr(){
  const nById=new Map(db.ncrs.map(n=>[n.id,n])),dById=new Map(db.defects.map(d=>[d.id,d]));
  db.defects.forEach(d=>{if(d.ncrId&&!nById.has(d.ncrId))d.ncrId=''});
  db.ncrs.forEach(n=>{n.defectIds=(n.defectIds||[]).filter(i=>{const d=dById.get(i);if(!d)return false;if(!d.ncrId){d.ncrId=n.id;return true}return d.ncrId===n.id})});
  db.defects.forEach(d=>{if(d.ncrId){const n=nById.get(d.ncrId);if(n&&!n.defectIds.includes(d.id))n.defectIds.push(d.id)}});
}
async function mergeIn(inc,name){
  const photos=inc.photos;delete inc.photos;
  inc=migrate(inc);
  const tomb=new Map();[...db.deleted,...inc.deleted].forEach(t=>{if(!tomb.has(t.id)||tomb.get(t.id)<t.at)tomb.set(t.id,t.at)});
  let a=0,u=0,del=0;
  // 같은 대상(이름·부품번호·월)이 다른 id로 만들어진 경우 로컬 id로 맞춤
  const norm=x=>String(x||'').replace(/\s+/g,'').replace(/\(주\)|㈜|주식회사/g,'').toLowerCase();
  const supRemap={};
  inc.suppliers.forEach(r=>{if(db.suppliers.some(x=>x.id===r.id))return;const m=db.suppliers.find(x=>norm(x.name)&&norm(x.name)===norm(r.name));if(m){supRemap[r.id]=m.id;r.id=m.id}});
  if(Object.keys(supRemap).length)['defects','ncrs','parts','receipts'].forEach(c=>inc[c].forEach(r=>{if(supRemap[r.supplierId])r.supplierId=supRemap[r.supplierId]}));
  inc.parts.forEach(r=>{if(db.parts.some(x=>x.id===r.id))return;const m=db.parts.find(x=>x.partNo&&x.partNo===r.partNo);if(m)r.id=m.id});
  inc.receipts.forEach(r=>{if(db.receipts.some(x=>x.id===r.id))return;const m=isLine(r)?db.receipts.find(x=>isLine(x)&&rcvKey(x)===rcvKey(r)):db.receipts.find(x=>!isLine(x)&&x.supplierId===r.supplierId&&x.month===r.month);if(m)r.id=m.id});
  inc.reviews.forEach(r=>{if(db.reviews.some(x=>x.id===r.id))return;const m=db.reviews.find(x=>x.month===r.month);if(m)r.id=m.id});
  COLLS.forEach(c=>{
    const map=new Map(db[c].map(r=>[r.id,r]));
    inc[c].forEach(r=>{const cur=map.get(r.id);if(!cur){map.set(r.id,r);a++;return}
      const rn=(r.updatedAt||'')>(cur.updatedAt||''),base=rn?r:cur,oth=rn?cur:r,m=mergeRec(base,oth);
      if(rn||m.changed){map.set(r.id,m.rec);u++}});
    const before=map.size;
    db[c]=[...map.values()].filter(r=>!(tomb.has(r.id)&&tomb.get(r.id)>=(r.updatedAt||'')));
    del+=before-db[c].length;
  });
  db.deleted=[...tomb].map(([id,at])=>({id,at}));
  if(inc.bom&&(inc.bom.updatedAt||'')>(db.bom.updatedAt||''))db.bom=inc.bom;  // BOM은 통째로: 더 최근 업로드가 이김
  relinkNcr();
  db.defects.forEach(d=>{if(Array.isArray(d.photos))d.photos=d.photos.filter(i=>!tomb.has(i))});
  let pn=0;
  try{
    if(Array.isArray(photos))pn=await applyPhotos(photos.filter(p=>!tomb.has(p.id)),false);
    const keep=new Set(db.defects.flatMap(d=>d.photos||[]));
    const dead=[...tomb.keys()].filter(i=>!keep.has(i));
    if(dead.length){await photoDel(dead);photoStr=null}
  }catch(e){toast('사진 병합 실패: '+e.message)}
  save();render();toast(`${name} 병합: 추가 ${a} · 갱신 ${u} · 삭제반영 ${del} · 사진 ${pn}장`);
}

const PDB='personalQMS_photos';let _idb=null,photoStr=null;
function idb(){
  if(!_idb)_idb=new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('이 브라우저는 사진 저장소를 지원하지 않습니다'));
    const r=indexedDB.open(PDB,2);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});if(!d.objectStoreNames.contains('handles'))d.createObjectStore('handles')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);

async function hTx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('handles',mode),out=fn(tx.objectStore('handles'));tx.oncomplete=()=>res(out instanceof IDBRequest?out.result:out);tx.onerror=()=>rej(tx.error)})}
const hGet=k=>hTx('readonly',s=>s.get(k)),hPut=(k,v)=>hTx('readwrite',s=>{s.put(v,k)}),hDel=k=>hTx('readwrite',s=>{s.delete(k)});

    tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('저장 공간 부족 또는 중단'));

}

/* ---- 사진 · 첨부 폴더 (이 PC에서 지정한 폴더) ----

const PH_IMG='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAkCAIAAABAJy5dAAAANElEQVR42u3OQQkAAAgEsOvf0I9Pc1hDYbAAS/WcEiEhISEhISEhISEhISEhISEhIaFPoQXCU6TAPfWPWAAAAABJRU5ErkJggg==';

const PH_DELQ='personalQMS_phDelQ';
function phDelQ(){try{return new Set(JSON.parse(localStorage.getItem(PH_DELQ)||'[]'))}catch(e){return new Set()}}

/* 사진 파일 이름: <NCR번호>_<YYYYMMDD>_<연번>.jpg  (NCR 발행 전: 미발행_<부품번호>_…, 날짜 = 사진 첨부일)
   NCR이 발행되거나 번호가 바뀌면 다음 동기화 때 새 이름으로 바꾼다 */
function phOwners(){
  const m={},put=(ids,no,part)=>(ids||[]).forEach(i=>{if(!m[i])m[i]={no,part}});
  const logIds=o=>(o.logs||[]).flatMap(l=>[...(l.photos||[]),...(l.hist||[]).flatMap(h=>h.photos||[])]);
  const nById=new Map(db.ncrs.map(n=>[n.id,n]));

  db.defects.forEach(d=>{const n=d.ncrId&&nById.get(d.ncrId);put(d.photos,n?n.no:'',d.partNo);put(logIds(d),n?n.no:'',d.partNo)});

const phSafe=v=>String(v||'').trim().replace(/[\\/:*?"<>|\s]+/g,'-').replace(/^-+|-+$/g,'');
function phPrefix(r,o){
  const day=(loc(r.createdAt,10)||today()).replace(/-/g,'');
  const head=o&&phSafe(o.no)?phSafe(o.no):`미발행_${phSafe(o&&o.part)||'사진'}`;
  return `${head}_${day}`;

function phNextName(pre,files){
  let mx=0;const rx=new RegExp('^'+pre.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'_(\\d+)\\.jpg$','i');
  files.forEach(n=>{const m=rx.exec(n);if(m)mx=Math.max(mx,+m[1])});
  return `${pre}_${String(mx+1).padStart(2,'0')}.jpg`;

function phDocName(pre,r,files){

function phPend(){try{return new Set(JSON.parse(localStorage.getItem(PH_PEND)||'[]'))}catch(e){return new Set()}}
function phPendSet(s){try{localStorage.setItem(PH_PEND,JSON.stringify([...s]))}catch(e){}}
function phPendAdd(ids){if(!ids.length)return;const s=phPend();ids.forEach(i=>s.add(i));phPendSet(s)}
const fileToURL=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(f)});
const urlToImg=u=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('사진 파일을 열 수 없습니다'));im.src=u});
async function syncPhotoFiles(relist){
  if(!photoDir)return;
  if(phBusy){phAgain=true;return}
  phBusy=true;let wrote=0,removed=0,loaded=0,renamed=0;
  try{
    if(!await permOK(photoDir,false)){permLost('photoDir',photoDir);return}
    if(relist||!phFiles){const s=new Set();for await(const [n,h] of photoDir.entries())if(h.kind==='file')s.add(n);phFiles=s}
    const files=phFiles,keys=new Set(await pTx('readonly',s=>s.getAllKeys())),pend=phPend(),own=phOwners(),live=new Set();
    // 1) 이 PC의 사진 → 정해진 이름의 파일로 저장 · 이름이 바뀌어야 하면 새 이름으로 옮김 (자리표시 이미지는 절대 쓰지 않음)
    for(const id of keys){
      const r=await photoGet(id);if(!r)continue;
      const cur=r.file||(files.has(phName(id))?phName(id):'');
      if(pend.has(id)||phIsPending(r)){if(cur)live.add(cur);continue}
      const pre=phPrefix(r,own[id]);
      if(cur&&files.has(cur)&&cur.startsWith(pre+'_')){live.add(cur);if(r.file!==cur)await photoPut([{...r,file:cur}]);continue}
      const nm=isDocRec(r)?phDocName(pre,r,files):phNextName(pre,files);
      const w=await (await photoDir.getFileHandle(nm,{create:true})).createWritable();
      await w.write(await (await fetch(r.data)).blob());await w.close();files.add(nm);live.add(nm);
      if(cur&&files.has(cur)){try{await photoDir.removeEntry(cur);files.delete(cur)}catch(e){}renamed++}else wrote++;
      await photoPut([{...r,file:nm}]);delete phCache[id];
    }
    // 2) 지운 사진 → 파일도 삭제 (지금 쓰는 사진의 파일은 남김)
    const dq=phDelQ();
    for(const n of [...dq]){if(!live.has(n)&&files.has(n)){try{await photoDir.removeEntry(n);files.delete(n);removed++}catch(e){continue}}dq.delete(n)}
    phDelQSet(dq);
    // 3) 다른 PC에서 올린 사진 ← 파일에서 불러오기
    for(const id of [...pend]){
      if(!keys.has(id)){pend.delete(id);continue}
      const r=await photoGet(id);if(!phIsPending(r)){pend.delete(id);continue}
      const nm=r.file||phName(id);if(!files.has(nm))continue;
      try{const data=await fileToURL(await (await photoDir.getFileHandle(nm)).getFile());
        if(isDocRec(r)?!isFileURL(data):!isImgURL(data))continue;
        await photoPut([{...r,pending:undefined,file:nm,data,thumb:isDocRec(r)?'':shrink(await urlToImg(data),320,.7)}]);
        delete phCache[id];pend.delete(id);loaded++}catch(e){}
    }
    phPendSet(pend);
    if(loaded||wrote||renamed)photoStr=null;
    if(wrote||renamed)save();  // 바뀐 파일 이름을 기록
    phDirtySet(false);
    if(loaded){toast(`사진 폴더에서 사진 ${loaded}장을 불러왔습니다`);if(!$('#cfm.on'))render()}
  }catch(e){toast('사진 폴더 동기화 실패: '+e.message)}
  finally{phBusy=false;updateSaveInfo();if(phAgain){phAgain=false;setTimeout(()=>syncPhotoFiles(false),500)}}
  return {wrote,renamed,removed,loaded};
}

function shrink(im,max,q){

  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));

const TOOLS=[

  {key:'timeline',name:'Timeline',lv:'기본',when:'언제부터 이상이 생겼는지 시간 순서로 재현할 때',how:['정상이던 마지막 시점부터 불량 발견 시점까지 사건을 시간 순으로 적습니다.','생산·검사·설비 정비·자재 입고·인원 변경 기록을 함께 모읍니다.','정상 → 이상으로 바뀐 경계 구간을 찾고, 그 사이 변화를 아래 변화점 표에 적습니다.']},

  {key:'fishbone',name:'특성요인도',lv:'기본',when:'원인 후보를 빠짐없이 펼쳐 볼 때 (팀 브레인스토밍)',how:['결과(특성)를 한 문장으로 씁니다.','6M 분류별로 생각나는 원인을 모두 적습니다. 이 단계에서는 거르지 않습니다.','현장·데이터로 확인해 "검증-원인" 또는 "기각"으로 표시합니다.','"검증-원인" 항목은 5 Why 워크시트를 추가해 더 파고듭니다.']},

  {key:'cem',name:'C&E Matrix',lv:'심화',when:'원인 후보가 많아 우선순위를 점수로 정해야 할 때',how:['결과 항목(Y)과 중요도(1~10)를 정합니다.','원인 후보(X)마다 각 Y와의 관계를 9(강) · 3(중) · 1(약) · 0(없음)으로 매깁니다.','총점 = Σ(관계 × 중요도)가 자동 계산되고 순위가 매겨집니다.','상위 원인부터 검증하거나 대책을 세웁니다.']},

async function anaClick(act,el){
  const c=czById('cases',czUi.caseId);if(!c)return;
  if(act==='addAna'){
    c.Analyses=c.Analyses||[];const a=blankAna(el.dataset.tool);c.Analyses.push(a);syncTools(c);touch(c);save();render();
    const w=document.getElementById('ws_'+a.id);if(w)w.scrollIntoView({behavior:'smooth',block:'start'});
    toast(`${toolOf(a.tool).name} 워크시트를 추가했습니다.`);return;
  }
  const a=(c.Analyses||[]).find(x=>String(x.id)===el.dataset.aid);if(!a)return;
  if(act==='anaToggle')a[el.dataset.k]=!a[el.dataset.k];
  else if(act==='anaDel'){
    const list=el.dataset.list,i=Number(el.dataset.i);
    if(!list){if(!await askConfirm({title:`${toolOf(a.tool).name} 워크시트를 삭제할까요?`,note:'삭제 후 10초 안에 되돌릴 수 있습니다.'}))return;
      const snap=await takeSnap();c.Analyses=c.Analyses.filter(x=>x!==a);syncTools(c);touch(c);save();render();offerUndo(snap,'워크시트를 삭제했습니다');return}
    else if(list==='nodes'){
      const kill=new Set([String(a.nodes[i].id)]);let grow=true;
      while(grow){grow=false;a.nodes.forEach(n=>{if(kill.has(String(n.parent))&&!kill.has(String(n.id))){kill.add(String(n.id));grow=true}})}
      a.nodes=a.nodes.filter(n=>!kill.has(String(n.id)));
    }
    else if(list==='ys'){a.ys.splice(i,1);a.xs.forEach(x=>x.s.splice(i,1))}
    else a[list].splice(i,1);
  }
  else if(act==='anaAdd'){
    const k=el.dataset.kind;
    if(k==='cand')a.cands.push({cause:'',basis:'',method:'',result:''});
    if(k==='tl')a.rows.push({t:'',ev:'',who:'',st:'정상',note:''});
    if(k==='tlc')a.changes.push({t:'',what:'',m4:'',impact:'',cause:''});
    if(k==='chg'){const cat=el.dataset.cat;let at=-1;a.items.forEach((x,i)=>{if(x.cat===cat)at=i});a.items.splice(at<0?a.items.length:at+1,0,{cat,item:'',before:'',after:'',impact:'',check:''})}
    if(k==='fb')a.rows.push({cat:el.dataset.cat,text:'',flag:''});
    if(k==='node'){a.nid=(a.nid||0)+1;a.nodes.push({id:a.nid,parent:el.dataset.parent,label:'',gate:'OR',p:'',likely:'',v:''})}
    if(k==='x')a.xs.push({name:'',s:a.ys.map(()=>'')});
    if(k==='y'){a.ys.push({name:'',w:'5'});a.xs.forEach(x=>x.s.push(''))}
    if(k==='sf')a.sfs.push({name:'',pf:''});
  }
  else if(act==='anaApply'){
    const src=el.dataset.src,to=el.dataset.to;
    let txt=src==='concl'?a.concl:[...(a[src]||[])].reverse().find(v=>has(v));
    if(!has(txt)){toast('옮길 내용이 없습니다. 먼저 워크시트를 작성하십시오.');return}
    txt=String(txt).trim();const cur=c[to]||'';
    if(cur.includes(txt)){toast('이미 반영된 내용입니다.');return}
    c[to]=(cur?cur+'\n':'')+`[${toolOf(a.tool).name}] `+txt;toast('원인 결론에 반영했습니다.');
  }
  a.updatedAt=now();touch(c);save();render();
}
